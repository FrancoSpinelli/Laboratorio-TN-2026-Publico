<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres formas de incorporar CSS</title>
    <link rel="stylesheet" href="estilos.css">
    <!-- 2. Interna -->
    <style>
      p { color: #1E2664; }
    </style>
</head>
<body>
    <!-- 1. Inline -->
    <p style="color: #1E2664;">Texto</p>

    <!-- 3. Externa: el <link> del <head> trae estilos.css -->
    <h1>Título con estilo de la hoja externa</h1>
</body>
</html>
