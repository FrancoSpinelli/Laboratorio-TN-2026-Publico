<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Práctica de Flexbox</title>
		<link rel="stylesheet" href="estilos.css" />
	</head>
	<body>
		<h1>Práctica de Flexbox</h1>

		<h2>Reto 1 — En fila</h2>
		<section class="fila">
			<div class="caja">1</div>
			<div class="caja">2</div>
			<div class="caja">3</div>
		</section>

		<h2>Reto 2 — Centrado</h2>
		<section class="centrado">
			<div class="caja">1</div>
			<div class="caja">2</div>
			<div class="caja">3</div>
		</section>

		<h2>Reto 3 — Menú</h2>
		<nav class="menu">
			<span class="logo">Mi sitio</span>
			<ul class="enlaces">
				<li><a href="#">Inicio</a></li>
				<li><a href="#">Proyectos</a></li>
				<li><a href="#">Contacto</a></li>
			</ul>
		</nav>

		<h2>Reto 4 — Galería</h2>
		<section class="galeria">
			<div class="foto">foto 1</div>
			<div class="foto">foto 2</div>
			<div class="foto">foto 3</div>
			<div class="foto">foto 4</div>
			<div class="foto">foto 5</div>
		</section>

		<h2>Reto 5 — En columna</h2>
		<section class="columna">
			<div class="caja">1</div>
			<div class="caja">2</div>
			<div class="caja">3</div>
		</section>
	</body>
</html>
