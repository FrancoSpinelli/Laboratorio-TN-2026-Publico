<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contacto</title>
	</head>
	<body>
		<header>
			<h1>Tu nombre</h1>
		</header>

		<nav>
			<a href="ficha.html">INICIO</a>
			<a href="contacto.html">CONTACTO</a>
		</nav>

		<main>
			<section>
				<h2>Contactame</h2>

				<form action="/contacto" method="post">
					<label for="nombre">Nombre</label>
					<input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />
					<br />

					<label for="email">Email</label>
					<input type="email" id="email" name="email" placeholder="tu@mail.com" required />
					<br />

					<label for="asunto">Asunto</label>
					<select id="asunto" name="asunto">
						<option value="consulta">Consulta</option>
						<option value="propuesta">Propuesta de trabajo</option>
						<option value="otro">Otro</option>
					</select>
					<br />

					<label for="mensaje">Mensaje</label>
					<br />
					<textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribí tu mensaje" required></textarea>
					<br />

					<input type="checkbox" id="acepto" name="acepto" required />
					<label for="acepto">Acepto ser contactado/a</label>
					<br />

					<button type="submit">Enviar</button>
				</form>
			</section>
		</main>

		<footer>
			<p>Hecho por Tu nombre</p>
		</footer>
	</body>
</html>
